name: Publish glossary page

# Publishes just databook/glossary.md to the live site, without Code Ocean.
#
# The rest of the databook is built in the Code Ocean capsule, because its pages
# execute notebooks against attached data assets. The glossary page executes
# nothing, so it can be built by Actions alone and dropped onto gh-pages as a
# single file. The other ~120 pages keep whatever the last capsule run deployed.
#
# That means the glossary can be published ahead of a full rebuild and may sit
# slightly out of step with the rest of the site — which is the accepted
# trade-off for not needing a capsule run to ship a definition fix.
#
# Why a full `jb build` and not something cheaper: the page has to carry the
# theme's chrome (header, sidebar nav, breadcrumbs) to look like part of the
# book, and only Sphinx can produce that. Execution is switched off, so the
# build is quick and the notebook cache is never touched. glossary.html comes
# out byte-identical to what the capsule would produce, provided the toolchain
# matches — see the asset check below, which is what enforces that.

on:
  push:
    branches: [main]
    paths:
      - databook/glossary.md
      - databook/_toc.yml
      - databook/_config.yml
      - scripts/build-glossary-page.mjs
      - .github/workflows/publish-glossary.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-glossary
  cancel-in-progress: false   # never interrupt a push to gh-pages

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pinned on purpose. The published page links to the _static bundle that
      # is already on gh-pages, so it must be built by the same toolchain the
      # capsule used. Bumping this without bumping the capsule (and vice versa)
      # is what the asset check downstream is there to catch.
      - name: Install Jupyter Book
        run: pip install "jupyter-book==1.0.4.post1"

      - name: Build the book with execution off
        working-directory: src
        run: |
          python - <<'PY'
          import re
          p = "databook/_config.yml"
          s = open(p).read()
          # the capsule's cache path does not exist here, and nothing on the
          # glossary page needs a kernel
          s = re.sub(r"execute:\n(?:  .*\n)+", "execute:\n  execute_notebooks: 'off'\n", s)
          open(p, "w").write(s)
          PY
          jb build -n --keep-going databook

      - name: Check the page only needs assets the live site already has
        id: assets
        run: |
          page=src/databook/_build/html/glossary.html
          test -f "$page" || { echo "::error::glossary.html was not built"; exit 1; }

          # every _static path the page links to, digests stripped
          grep -oE '_static/[^"?'"'"' ]+' "$page" | sed 's/?.*//' | sort -u > /tmp/need.txt

          missing=0
          : > /tmp/add.txt
          while read -r f; do
            if [ ! -f "site/$f" ]; then
              # a filename the live site has never seen: safe to add, since
              # nothing else links to it
              if [ -f "src/databook/_build/html/$f" ]; then
                echo "$f" >> /tmp/add.txt
              else
                echo "::error::page needs $f but the build did not produce it"
                missing=1
              fi
            fi
          done < /tmp/need.txt

          if [ "$missing" = "1" ]; then exit 1; fi

          if [ -s /tmp/add.txt ]; then
            echo "::warning::The toolchain here differs from the one that built the live site."
            echo "::warning::Adding $(wc -l < /tmp/add.txt) new asset(s). Existing shared assets are left alone,"
            echo "::warning::so this page may drift visually from the rest of the book until the capsule"
            echo "::warning::and this workflow are pinned to the same versions."
            cat /tmp/add.txt
          fi

      - name: Copy the page onto the site
        run: |
          cp src/databook/_build/html/glossary.html site/glossary.html
          # the "show source" link on the page points at this
          mkdir -p site/_sources
          cp src/databook/_build/html/_sources/glossary.md.txt site/_sources/ 2>/dev/null || true
          # additive-only: never overwrite an asset the other pages already use
          while read -r f; do
            mkdir -p "site/$(dirname "$f")"
            cp "src/databook/_build/html/$f" "site/$f"
          done < /tmp/add.txt

      - name: Commit and push
        working-directory: site
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed; the published page is already current."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish glossary page from ${GITHUB_SHA::7}"
          git push origin gh-pages
